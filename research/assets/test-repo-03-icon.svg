<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Amber Cyber IT Gradient -->
    <linearGradient id="cyber3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Dark Terminal Inner Base -->
    <linearGradient id="terminalBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Cyber Amber Accent -->
  <rect width="128" height="128" rx="28" fill="url(#cyber3)" />

  <!-- Inner Dark Terminal Card (JetBrains Style) -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#terminalBg3)" />

  <!-- Neon Terminal Prompt Accent (Top Left) -->
  <text x="18" y="32" fill="#fbbf24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="900">&gt;_</text>

  <!-- High-Contrast Monospace Digit 3 (JetBrains Mono) -->
  <text x="64" y="96" 
        fill="#ffffff" 
        font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', monospace" 
        font-size="76" 
        font-weight="800" 
        text-anchor="middle">
    3
  </text>
</svg>
